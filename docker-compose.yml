version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: panfilov-postgres
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: valeriy
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valeriy -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - student-net

  app:
    build: .
    image: panfilov-valeriy-api:v1.0-panfilov-valeriy
    container_name: panfilov-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studentdb
      SPRING_DATASOURCE_USERNAME: valeriy
      SPRING_DATASOURCE_PASSWORD: secretpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student-net

volumes:
  postgres_data:

networks:
  student-net:
    driver: bridge
